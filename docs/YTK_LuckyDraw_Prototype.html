<title>YTK Lucky Draw Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: one-screen iPad kiosk. Title on top, gift box centred on a violet stage,
   one big gold button at the bottom. The prize reveal is a modal card over a white flash.
   Single dark look by choice: the glow only works on a deep violet ground. */
:root{
  --bg-0:#141a26;
  --bg-1:#1e2430;
  --bg-2:#3a3320;
  --lav:#f5c242;
  --paper:#f7f7f5;
  --ink:#1e2430;
  --ink-soft:#d8dbe3;
  --gold:#f5c242;
  --gold-deep:#b8861a;
  --red:#e14b4b;
  --red-deep:#b83030;
  --glow:#fff6d6;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'DM Sans',-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0}
@supports (height:100dvh){html,body{height:100dvh}}
body{
  background:var(--bg-0);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:16px;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(60% 45% at 50% 52%, rgba(245,194,66,.30), transparent 70%),
    radial-gradient(90% 60% at 50% 112%, rgba(225,75,75,.38), transparent 70%),
    linear-gradient(180deg,var(--bg-0),var(--bg-1) 75%,#2a2230);
}
.app{
  position:relative;z-index:1;height:100%;
  display:grid;grid-template-rows:auto auto auto;align-content:center;
  box-sizing:border-box;width:100%;max-width:100%;
  padding-inline:16px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  gap:14px;overflow:hidden;
}
.head{text-align:center;display:grid;gap:8px;justify-items:center}
h1{
  margin:0;display:grid;justify-items:center;gap:2px;
  font:800 clamp(24px,6vw,40px)/1.08 var(--font-display);
  letter-spacing:.06em;text-indent:.06em;
  color:var(--gold);text-shadow:0 3px 0 var(--gold-deep),0 10px 30px rgba(245,194,66,.35);
}
h1 .y{
  font-size:clamp(44px,12vw,84px);line-height:1;letter-spacing:.1em;text-indent:.1em;
  color:var(--red);text-shadow:0 4px 0 var(--red-deep),0 12px 34px rgba(225,75,75,.4);
}
h1 .l{display:block}
.rule{margin:0;font-size:clamp(14px,2.2vw,18px);color:var(--ink-soft);line-height:1.5;text-wrap:balance}

.stage-wrap{display:grid;place-items:center;min-height:0}
.stage{
  position:relative;
  width:min(80vw,48vh,540px);aspect-ratio:400/420;max-width:100%;
  cursor:pointer;
}
@supports (height:100dvh){
  /* 250px reserves room for the title above and the button below, so the whole group fits one screen */
  .stage{width:min(86vw,calc((100dvh - 310px) * 400 / 420),520px)}
}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}
.stage:not(.busy) svg{animation:float 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
#box{transform-origin:200px 345px}
#base{transform-origin:200px 345px}
#lid{transform-origin:200px 198px}

.rays,.halo,.beam{position:absolute;pointer-events:none;opacity:0;mix-blend-mode:screen}
.rays{
  z-index:0;left:50%;top:51%;width:260%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,246,214,.5) 0 5deg,transparent 5deg 17deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 22%,transparent 60%);
  mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 22%,transparent 60%);
  transition:opacity .9s ease;
}
.rays.on{opacity:.85;animation:spin 14s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.halo{
  z-index:2;left:50%;top:51%;width:70%;aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.15);
  background:radial-gradient(circle,#fffbe8 0,rgba(255,236,160,.85) 24%,rgba(225,75,75,.3) 50%,transparent 70%);
}
.beam{
  z-index:2;left:50%;top:51%;width:84%;height:160%;
  transform-origin:50% 100%;
  transform:translate(-50%,-100%) scaleY(0);
  background:linear-gradient(to top,rgba(255,248,215,.95),rgba(255,230,150,.35) 55%,rgba(255,230,150,0));
  clip-path:polygon(34% 100%,66% 100%,100% 0,0 0);
  filter:blur(7px);
}

.foot{display:grid;justify-items:center;gap:10px;padding-bottom:6px;position:relative;z-index:3}
.cta{
  appearance:none;border:0;cursor:pointer;
  min-height:68px;padding:10px 48px;border-radius:999px;max-width:100%;
  display:grid;place-items:center;
  background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,#e0a92a);
  color:var(--ink);
  box-shadow:0 6px 0 var(--gold-deep),0 14px 34px rgba(245,194,66,.4);
  font-family:var(--font-body);
  animation:pulse 2.2s ease-in-out infinite;
  transition:transform .12s ease,box-shadow .12s ease;
}
.cta b{font:800 20px/1.2 var(--font-display);letter-spacing:.14em;text-indent:.14em;white-space:nowrap}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep),0 8px 20px rgba(245,194,66,.4)}
.cta:disabled{animation:none;opacity:.55;cursor:default}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--gold-deep),0 14px 46px rgba(245,194,66,.75)}}
.proto-btn{
  position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:15;
  appearance:none;cursor:pointer;
  background:rgba(20,26,38,.55);color:var(--ink-soft);
  border:1px solid rgba(216,219,227,.3);border-radius:10px;
  font:500 12px/1 var(--font-body);padding:8px 11px;letter-spacing:.04em;opacity:.7;
}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:12;pointer-events:none}
.flash{position:fixed;inset:0;z-index:11;background:#fffbe8;opacity:0;pointer-events:none}

.popup{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;
  background:rgba(10,13,20,.78);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.burst-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.burst{
  position:absolute;left:50%;top:50%;width:min(170vw,1200px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(245,194,66,.32) 0 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 58%);
  mask-image:radial-gradient(circle,#000 0,transparent 58%);
  animation:spin 26s linear infinite;
}
.card{
  position:relative;width:min(100%,460px);box-sizing:border-box;text-align:center;
  background:linear-gradient(165deg,#ffffff,#eceef2);
  color:var(--ink);border-radius:30px;padding:30px 24px 26px;margin:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.25);
  display:grid;gap:10px;justify-items:center;
}
.chip{
  font:800 12px/1 var(--font-display);letter-spacing:.2em;
  padding:9px 16px;border-radius:999px;color:var(--ink);
}
.congrats{margin:6px 0 0;font:700 13px/1 var(--font-display);color:var(--red);letter-spacing:.2em;text-transform:uppercase}
.card h2{
  margin:0;font:800 clamp(26px,5.4vw,36px)/1.15 var(--font-display);
  text-wrap:balance;letter-spacing:-.01em;
}
.ticket{
  margin-top:8px;width:100%;display:grid;gap:4px;
  border:2px dashed #d9a62a;border-radius:16px;padding:14px 12px;background:#fff8e3;
}
.ticket span{font:700 11px/1 var(--font-display);letter-spacing:.24em;color:#8a6a10}
.ticket strong{font:800 clamp(24px,5vw,30px)/1.1 var(--font-display);letter-spacing:.14em;text-indent:.14em}
.cashier{margin:2px 0 0;font-size:15px;line-height:1.5;color:#4b5263}
.done{
  margin-top:10px;appearance:none;border:0;cursor:pointer;
  min-height:56px;padding:0 46px;border-radius:999px;
  background:var(--ink);color:#fff;font:800 16px/1 var(--font-display);letter-spacing:.2em;text-indent:.2em;
}
.done:active{transform:scale(.97)}

.sheet{
  max-height:78dvh;overflow:auto;
  position:fixed;left:12px;right:12px;bottom:12px;z-index:20;max-width:520px;
  background:rgba(20,26,38,.97);border:1px solid rgba(216,219,227,.3);border-radius:18px;
  padding:16px;display:grid;gap:12px;font-size:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  user-select:text;-webkit-user-select:text;
}
.sheet h3{margin:0;font:700 12px/1 var(--font-display);letter-spacing:.2em;color:var(--lav)}
.sheet .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sheet select{
  background:#2a3242;color:var(--paper);border:1px solid rgba(216,219,227,.4);
  border-radius:10px;padding:9px 10px;font:inherit;min-width:0;max-width:100%;
}
.sheet table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sheet td{padding:6px 4px;border-top:1px solid rgba(216,219,227,.15);vertical-align:top}
.sheet td:last-child{text-align:right;white-space:nowrap}
.sheet .note{margin:0;font-size:12px;line-height:1.5;color:var(--ink-soft)}
.sheet .close{
  justify-self:end;appearance:none;cursor:pointer;background:transparent;color:var(--paper);
  border:1px solid rgba(216,219,227,.4);border-radius:10px;padding:8px 14px;font:inherit;
}

@media (max-height:760px){
  .card{padding:22px 20px 20px;gap:8px}
  .card h2{font-size:clamp(22px,5vw,30px)}
  .done{min-height:50px}
}
@media (orientation:landscape) and (max-height:520px){
  .app{
    grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    grid-template-areas:"stage head" "stage foot";
    column-gap:16px;align-content:stretch;
  }
  @supports (height:100dvh){
    .stage{width:min(44vw,calc((100dvh - 40px) * 400 / 420))}
  }
  .head{grid-area:head;align-self:end}
  .stage-wrap{grid-area:stage}
  .foot{grid-area:foot;align-self:start}
  .rule{display:block}
  h1 .y{font-size:clamp(34px,7vw,54px)}
  h1 .l{font-size:clamp(18px,3.4vw,28px)}
  .card{width:min(70vw,420px)}
}
@media (max-height:640px){
  h1 .y{font-size:40px}
  h1 .l{font-size:22px}
  .rule{display:none}
  .cta{min-height:58px}
  .cta b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  .stage:not(.busy) svg,.cta,.rays.on,.burst{animation:none}
}
</style>

<div class="bg"></div>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>

<main class="app">
  <header class="head">
    <h1><span class="y">YTK</span><span class="l">LUCKY DRAW</span></h1>
    <p class="rule">Spend RM100 or more in one bill to draw once</p>
  </header>

  <section class="stage-wrap">
    <div class="stage" id="stage">
      <div class="rays" id="rays"></div>
      <svg viewBox="0 0 400 420" aria-hidden="true">
        <defs>
          <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#e8b52e"/><stop offset=".45" stop-color="#ffd966"/><stop offset="1" stop-color="#d9a21f"/>
          </linearGradient>
          <linearGradient id="gLid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe796"/><stop offset="1" stop-color="#f0b82e"/>
          </linearGradient>
          <linearGradient id="gRib" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#a82525"/><stop offset=".5" stop-color="#e14b4b"/><stop offset="1" stop-color="#931f1f"/>
          </linearGradient>
          <radialGradient id="gIn" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fffbe6"/><stop offset=".55" stop-color="#ffd978"/><stop offset="1" stop-color="#f08a5a"/>
          </radialGradient>
          <radialGradient id="gShadow" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#05070c" stop-opacity=".55"/><stop offset="1" stop-color="#05070c" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="200" cy="374" rx="140" ry="17" fill="url(#gShadow)"/>
        <g id="box">
          <g id="base">
            <ellipse cx="200" cy="215" rx="90" ry="22" fill="#2a1d1d"/>
            <ellipse id="inner" cx="200" cy="215" rx="90" ry="22" fill="url(#gIn)" opacity="0"/>
            <path d="M110 215 A90 22 0 0 0 290 215 L290 333 Q290 345 278 345 L122 345 Q110 345 110 333 Z" fill="url(#gBody)"/>
            <path d="M188 237 Q200 238.5 212 237 L212 345 L188 345 Z" fill="url(#gRib)"/>
            <path d="M110 215 A90 22 0 0 0 290 215" fill="none" stroke="#fff0b8" stroke-width="2"/>
          </g>
          <g id="lid">
            <path d="M198 172 C168 112 112 126 138 162 C150 178 182 180 198 172 Z" fill="url(#gRib)" stroke="#8f2323" stroke-width="2"/>
            <path d="M202 172 C232 112 288 126 262 162 C250 178 218 180 202 172 Z" fill="url(#gRib)" stroke="#8f2323" stroke-width="2"/>
            <path d="M150 152 C158 140 172 140 184 160" fill="none" stroke="#ff7a7a" stroke-width="3" stroke-linecap="round" opacity=".8"/>
            <rect x="96" y="176" width="208" height="44" rx="10" fill="url(#gLid)"/>
            <rect x="96" y="208" width="208" height="12" rx="6" fill="#c8921a"/>
            <rect x="188" y="176" width="24" height="44" fill="url(#gRib)"/>
            <ellipse cx="200" cy="172" rx="15" ry="11" fill="url(#gRib)" stroke="#8f2323" stroke-width="2"/>
          </g>
        </g>
      </svg>
      <div class="halo" id="halo"></div>
      <div class="beam" id="beam"></div>
    </div>
  </section>

  <footer class="foot">
    <button class="cta" id="open" type="button"><b>TAP TO OPEN</b></button>
    <button class="proto-btn" id="protoBtn" type="button">Prototype</button>
  </footer>
</main>

<div class="popup" id="popup" hidden role="dialog" aria-modal="true" aria-labelledby="pz-name">
  <div class="burst-wrap"><div class="burst"></div></div>
  <div class="card" id="card">
    <div class="chip" id="pz-tier"></div>
    <p class="congrats">You won</p>
    <h2 id="pz-name"></h2>
    <p class="cashier">Show this screen to the cashier</p>
    <button class="done" id="done" type="button">DONE</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <h3>PROTOTYPE</h3>
  <div class="row">
    <label for="muteChk"><input type="checkbox" id="muteChk"> Mute sound</label>
    <label for="choirChk"><input type="checkbox" id="choirChk" checked> Choir "Y-T-K"</label>
    <label for="forceSel">Next prize
      <select id="forceSel"><option value="random">Random (by odds)</option></select>
    </label>
  </div>
  <table id="odds" aria-label="Prize odds"></table>
  <p class="note">Example prizes and odds for testing only. In the real build the server picks the prize the moment the customer taps, so refreshing the page cannot re-roll it. Draws this session: <b id="count">0</b></p>
  <button class="close" id="sheetClose" type="button">Close</button>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Example prize pool (weights add up to 100) ---------- */
  var PRIZES=[
    {id:'p100',tier:'GRAND PRIZE',name:'RM100 Purchase Voucher',w:2,color:'#f5c242'},
    {id:'p50',tier:'1ST PRIZE',name:'RM50 Purchase Voucher',w:5,color:'#e14b4b',fg:'#fff'},
    {id:'p20',tier:'2ND PRIZE',name:'RM20 Purchase Voucher',w:13,color:'#bcd6ff'},
    {id:'p10',tier:'3RD PRIZE',name:'RM10 Purchase Voucher',w:25,color:'#b5ecc9'},
    {id:'glove',tier:'LUCKY GIFT',name:'Work Gloves (1 pair)',w:25,color:'#e4e6ec'},
    {id:'tape',tier:'LUCKY GIFT',name:'Tape Measure 5m',w:30,color:'#e4e6ec'}
  ];
  var forced='random',muted=false,state='idle',draws=0;

  /* In production this runs on the server. Here it is a stand-in. */
  function pickPrize(){
    if(forced!=='random'){return PRIZES.filter(function(p){return p.id===forced})[0]}
    var total=PRIZES.reduce(function(a,p){return a+p.w},0),r=Math.random()*total;
    for(var i=0;i<PRIZES.length;i++){r-=PRIZES[i].w;if(r<=0)return PRIZES[i]}
    return PRIZES[PRIZES.length-1];
  }
  function makeCode(){
    var s='ABCDEFGHJKMNPQRSTUVWXYZ23456789',o='';
    for(var i=0;i<6;i++)o+=s[Math.floor(Math.random()*s.length)];
    return 'YTK-'+o;
  }
  function requestPrize(){
    return new Promise(function(res){
      setTimeout(function(){res({prize:pickPrize(),code:makeCode()})},300+Math.random()*500);
    });
  }
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  var rand=function(a,b){return a+Math.random()*(b-a)};

  /* ---------- Sound (Web Audio, no files) ---------- */
  var audio=null,noiseBuf=null;
  function ac(){
    try{
      if(!audio){var C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}
      if(audio&&audio.state==='suspended')audio.resume();
    }catch(e){audio=null}
    return audio;
  }
  function tone(f,t0,dur,type,vol,f2){
    var o=audio.createOscillator(),g=audio.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(audio.destination);o.start(t0);o.stop(t0+dur+0.05);
  }
  function whoosh(t0,dur,vol,f1,f2){
    if(!noiseBuf){
      noiseBuf=audio.createBuffer(1,audio.sampleRate,audio.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    var s=audio.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    var f=audio.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
    f.frequency.setValueAtTime(f1,t0);f.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    var g=audio.createGain();
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+dur*0.3);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f);f.connect(g);g.connect(audio.destination);s.start(t0);s.stop(t0+dur+0.05);
  }
  var sfx={
    rumble:function(){
      if(muted||!ac())return;var t=audio.currentTime;
      var o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();
      o.type='sawtooth';o.frequency.setValueAtTime(48,t);o.frequency.linearRampToValueAtTime(95,t+1.05);
      f.type='lowpass';f.frequency.value=240;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.2,t+0.9);g.gain.linearRampToValueAtTime(0.0001,t+1.08);
      o.connect(f);f.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+1.1);
      for(var i=0;i<12;i++)tone(320+i*45,t+i*0.085,0.045,'square',0.03+i*0.004);
    },
    pop:function(){
      if(muted||!ac())return;var t=audio.currentTime;
      whoosh(t,0.6,0.28,500,3200);tone(520,t,0.22,'sine',0.25,90);
    },
    shimmer:function(){
      if(muted||!ac())return;var t=audio.currentTime;
      var n=[523.25,659.25,783.99,1046.5,1318.5,1568,2093];
      for(var i=0;i<n.length;i++)tone(n[i],t+0.1+i*0.19,0.5,'triangle',0.07);
    },
    chime:function(){
      if(muted||!ac())return;var t=audio.currentTime;
      var n=[1046.5,1318.5,1568,2093];
      for(var i=0;i<n.length;i++){tone(n[i],t+i*0.09,1.3,'triangle',0.12);tone(n[i]*2,t+i*0.09,0.8,'sine',0.03)}
      tone(130.8,t,0.9,'sine',0.18);
    }
  };


  /* ---------- Choir: "Y ~ T ~ K ~" ----------
     SATB ensemble: every part is several slightly different voices (own pitch, vibrato, entry time)
     sharing one set of vowel formants. Formant synthesis, no audio files. */
  var VOW={oo:[300,870,2240],ah:[730,1090,2440],ee:[270,2290,3010],eh:[530,1840,2480]};
  var PARTS=[
    {name:'bass',   n:4, scale:0.92, vol:1.05, male:true},
    {name:'tenor',  n:4, scale:1.00, vol:0.95, male:true},
    {name:'alto',   n:5, scale:1.12, vol:0.85, male:false},
    {name:'soprano',n:5, scale:1.20, vol:0.80, male:false}
  ];
  function makeReverb(ctx,out){
    var len=Math.floor(ctx.sampleRate*2.8),ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(var c=0;c<2;c++){var d=ir.getChannelData(c),lp=0;
      for(var i=0;i<len;i++){lp+=((Math.random()*2-1)-lp)*0.55;d[i]=lp*Math.pow(1-i/len,2.3)}}
    var cv=ctx.createConvolver();cv.buffer=ir;
    var w=ctx.createGain();w.gain.value=0.55;cv.connect(w);w.connect(out);return cv;
  }
  function glottal(ctx){
    var N=48,re=new Float32Array(N),im=new Float32Array(N);
    for(var n=1;n<N;n++)im[n]=1/Math.pow(n,1.45);
    return ctx.createPeriodicWave(re,im);
  }
  function burst(ctx,out,t,kind){
    var n=Math.floor(ctx.sampleRate*0.09),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    var s=ctx.createBufferSource();s.buffer=b;
    var f=ctx.createBiquadFilter();
    if(kind==='t'){f.type='highpass';f.frequency.value=5200}else{f.type='bandpass';f.frequency.value=2100;f.Q.value=1.1}
    var g=ctx.createGain();g.gain.value=kind==='t'?0.4:0.55;
    s.connect(f);f.connect(g);g.connect(out);s.start(t);
  }
  function rnd(a,b){return a+Math.random()*(b-a)}

  function sing(ctx,t0,out){
    var bus=ctx.createGain();bus.gain.value=0.62;
    var comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;comp.attack.value=0.02;
    bus.connect(comp);comp.connect(out);
    var rev=makeReverb(ctx,out);
    var wave=glottal(ctx);
    var SYL=[
      {t:0,   dur:0.64,chord:[130.8,261.6,329.6,392],  vow:[[0,'oo'],[0.10,'ah'],[0.40,'ee']],cons:null},
      {t:0.64,dur:0.62,chord:[174.6,261.6,349.2,440],  vow:[[0,'ee']],cons:'t'},
      {t:1.26,dur:1.90,chord:[130.8,329.6,392,523.3],  vow:[[0,'eh'],[0.35,'ee']],cons:'k',cresc:true}
    ];
    var END=t0+3.5;

    PARTS.forEach(function(P,pi){
      var pb=ctx.createGain();pb.gain.value=1;            /* part bus: sum of this part's voices */
      /* vowel formants shared by the part, automated through the three syllables */
      var out2=ctx.createGain();out2.gain.value=P.vol;
      [0,1,2].forEach(function(i){
        var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=[5,11,14][i];
        var first=SYL[0].vow[0][1];
        bp.frequency.setValueAtTime(VOW[first][i]*P.scale,t0);
        SYL.forEach(function(s){s.vow.forEach(function(v,k){
          if(s===SYL[0]&&k===0)return;
          bp.frequency.setTargetAtTime(VOW[v[1]][i]*P.scale,t0+s.t+v[0],0.06);
        })});
        var g=ctx.createGain();g.gain.value=[1,0.55,0.28][i];
        pb.connect(bp);bp.connect(g);g.connect(out2);
      });
      /* body: low harmonics that the narrow formants would otherwise remove */
      var low=ctx.createBiquadFilter();low.type='lowpass';low.frequency.value=800;
      var lg=ctx.createGain();lg.gain.value=0.45;pb.connect(low);low.connect(lg);lg.connect(out2);
      /* singer's formant: the ring that lets a choir cut through */
      var sf=ctx.createBiquadFilter();sf.type='peaking';sf.frequency.value=P.male?2800:3200;sf.gain.value=P.male?6:3;sf.Q.value=1.2;
      out2.connect(sf);sf.connect(bus);
      var send=ctx.createGain();send.gain.value=0.8;sf.connect(send);send.connect(rev);

      /* breath, pushed through the same formants */
      var nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),nd=nb.getChannelData(0);
      for(var q=0;q<nd.length;q++)nd[q]=Math.random()*2-1;
      var ns=ctx.createBufferSource();ns.buffer=nb;ns.loop=true;
      var ng=ctx.createGain();ng.gain.value=0.035;ns.connect(ng);ng.connect(pb);ns.start(t0);ns.stop(END);

      /* the individual singers */
      for(var v=0;v<P.n;v++){
        var drift=rnd(-14,14),vibRate=rnd(4.8,6.2),vibDepth=rnd(10,22),late=rnd(0,0.05);
        SYL.forEach(function(s){
          var f=s.chord[pi],ts=t0+s.t+late,dur=s.dur,end=ts+dur+0.38;
          var o=ctx.createOscillator();o.setPeriodicWave(wave);
          o.frequency.setValueAtTime(f*0.975,ts);o.frequency.linearRampToValueAtTime(f,ts+0.09);
          o.detune.value=drift;
          var lfo=ctx.createOscillator(),lgn=ctx.createGain();
          lfo.frequency.value=vibRate;
          lgn.gain.setValueAtTime(0,ts);lgn.gain.linearRampToValueAtTime(vibDepth,ts+dur*0.7);
          lfo.connect(lgn);lgn.connect(o.detune);
          var env=ctx.createGain(),amp=0.16*rnd(0.8,1.1);
          env.gain.setValueAtTime(0.0001,ts);
          env.gain.linearRampToValueAtTime(amp,ts+0.09);
          env.gain.linearRampToValueAtTime(s.cresc?amp*1.45:amp,ts+dur*0.8);
          env.gain.linearRampToValueAtTime(0.0001,end);
          o.connect(env);env.connect(pb);
          o.start(ts);o.stop(end+0.05);lfo.start(ts);lfo.stop(end+0.05);
        });
      }
    });
    SYL.forEach(function(s){if(s.cons)burst(ctx,bus,t0+s.t-0.012,s.cons)});
  }
  window.__sing=sing;
  var choirOn=true;
  function singYTK(){
    if(muted||!choirOn||!ac())return false;
    var m=audio.createGain();m.gain.value=0.9;m.connect(audio.destination);
    sing(audio,audio.currentTime+0.02,m);return true;
  }

  /* ---------- Particles ---------- */
  var cv=$('#fx'),cx=cv.getContext('2d'),W=0,H=0,parts=[];
  var COLORS=['#f5c242','#fff3c4','#e14b4b','#ffffff','#ffd77a','#e14b4b'];
  function resize(){
    var d=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    parts=parts.filter(function(p){return p.t!=='d'});
    for(var i=0;i<28;i++)parts.push({t:'d',x:rand(0,W),y:rand(0,H),vx:rand(-6,6),vy:rand(-14,-4),r:rand(1,2.6),life:rand(0,6),max:Infinity});
  }
  function emitConfetti(x,y,n,dir,spread,smin,smax){
    n=Math.round(n*(RM?0.4:1));
    for(var i=0;i<n;i++){
      var a=dir+(Math.random()-0.5)*spread,s=rand(smin,smax);
      parts.push({t:'c',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:rand(0,6.28),vr:rand(-9,9),
        w:rand(6,12),h:rand(10,18),col:COLORS[Math.floor(Math.random()*COLORS.length)],ph:rand(0,6.28),life:0,max:rand(2.6,3.8)});
    }
  }
  function emitSpark(x,y,n,k){
    var cols=['255,246,214','255,214,120','255,120,100'];
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+(Math.random()-0.5)*1.5,s=rand(160,430);
      parts.push({t:'s',x:x+rand(-60,60)*k,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(2,5),
        col:cols[Math.floor(Math.random()*cols.length)],life:0,max:rand(0.6,1.2)});
    }
  }
  var last=performance.now();
  function tick(now){
    var dt=Math.min(0.033,(now-last)/1000);last=now;
    cx.clearRect(0,0,W,H);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];p.life+=dt;
      if(p.life>p.max){parts.splice(i,1);continue}
      if(p.t==='c'){
        p.vy+=900*dt;p.vx*=1-1.5*dt;p.vy*=1-1.1*dt;
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
        cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.cos(p.ph+p.life*9));
        cx.globalAlpha=Math.min(1,(p.max-p.life)*2);cx.fillStyle=p.col;
        cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
      }else if(p.t==='s'){
        p.vy+=120*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
        var al=1-p.life/p.max;
        cx.globalCompositeOperation='lighter';
        cx.fillStyle='rgba('+p.col+','+(al*0.28)+')';cx.beginPath();cx.arc(p.x,p.y,p.r*3,0,6.283);cx.fill();
        cx.fillStyle='rgba('+p.col+','+al+')';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
        cx.globalCompositeOperation='source-over';
      }else{
        p.x+=p.vx*dt;p.y+=p.vy*dt;
        if(p.y<-10){p.y=H+10;p.x=rand(0,W)}
        if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
        cx.fillStyle='rgba(255,230,160,'+(0.18+0.22*Math.abs(Math.sin(p.life*1.3)))+')';
        cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
      }
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize',resize);
  resize();requestAnimationFrame(tick);

  /* ---------- Scene ---------- */
  var stage=$('#stage'),box=$('#box'),lid=$('#lid'),base=$('#base'),inner=$('#inner'),
      halo=$('#halo'),beam=$('#beam'),rays=$('#rays'),flash=$('#flash'),
      btn=$('#open'),popup=$('#popup'),card=$('#card');

  function opening(){
    var r=stage.getBoundingClientRect();
    return {x:r.left+r.width*0.5,y:r.top+r.height*(215/420),k:r.width/400};
  }
  function shakeFrames(amp){
    var f=[],n=16;
    for(var i=0;i<=n;i++){
      var k=i/n,a=(1.5+k*7)*amp,sgn=i%2?1:-1;
      f.push({offset:k,transform:'translate('+(sgn*a).toFixed(1)+'px,'+(rand(-1,1)*a*0.3).toFixed(1)+'px) rotate('+(sgn*a*0.35).toFixed(2)+'deg)'});
    }
    f[f.length-1].transform='translate(0,0) rotate(0deg)';
    return f;
  }

  async function openBox(){
    if(state!=='idle')return;
    state='busy';ac();
    btn.disabled=true;stage.classList.add('busy');
    var prizeP=requestPrize();          /* result is decided here, before any animation */
    sfx.rumble();
    await box.animate(shakeFrames(RM?0.3:1),{duration:1050,easing:'linear'}).finished;

    sfx.pop();
    var o=opening();
    lid.animate([
      {transform:'translate(0,0) rotate(0deg)'},
      {transform:'translate(-6px,-235px) rotate(-16deg)',offset:0.7},
      {transform:'translate(-12px,-255px) rotate(-22deg)'}
    ],{duration:950,easing:'cubic-bezier(.15,.8,.25,1)',fill:'forwards'});
    base.animate([
      {transform:'scale(1.05,0.9)'},{transform:'scale(.98,1.03)',offset:0.5},{transform:'scale(1,1)'}
    ],{duration:600,easing:'ease-out'});
    inner.animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'});
    beam.animate([
      {transform:'translate(-50%,-100%) scaleY(0)',opacity:0},
      {transform:'translate(-50%,-100%) scaleY(1)',opacity:1}
    ],{duration:800,easing:'ease-out',fill:'forwards'});
    halo.animate([
      {transform:'translate(-50%,-50%) scale(.15)',opacity:0},
      {transform:'translate(-50%,-50%) scale(.7)',opacity:0.9,offset:0.35},
      {transform:'translate(-50%,-50%) scale(3.2)',opacity:1}
    ],{duration:1600,easing:'ease-in',fill:'forwards'});
    rays.classList.add('on');
    emitSpark(o.x,o.y,RM?10:46,o.k);
    sfx.shimmer();
    var spk=setInterval(function(){var q=opening();emitSpark(q.x,q.y,RM?1:3,q.k)},45);
    await sleep(1550);
    clearInterval(spk);

    var result=await prizeP;
    var sang=singYTK();
    await flash.animate([{opacity:0},{opacity:1}],{duration:240,fill:'forwards'}).finished;
    showPopup(result);
    flash.animate([{opacity:1},{opacity:0}],{duration:700,delay:60,fill:'forwards'});
    if(sang)setTimeout(sfx.chime,1300);else sfx.chime();
    emitConfetti(W*0.5,H*0.42,90,-Math.PI/2,Math.PI*0.9,500,1100);
    emitConfetti(0,H*0.75,50,-Math.PI/3,0.9,700,1300);
    emitConfetti(W,H*0.75,50,-Math.PI*2/3,0.9,700,1300);
    state='popup';
  }

  function showPopup(r){
    var p=r.prize;
    var chip=$('#pz-tier');
    chip.textContent=p.tier;chip.style.background=p.color;chip.style.color=p.fg||'#1e2430';
    $('#pz-name').textContent=p.name;
    popup.hidden=false;
    card.animate([
      {transform:'scale(.5) translateY(30px)',opacity:0},
      {transform:'scale(1.05) translateY(0)',opacity:1,offset:0.65},
      {transform:'scale(1)',opacity:1}
    ],{duration:650,easing:'cubic-bezier(.3,.9,.3,1)'});
    draws++;$('#count').textContent=draws;
  }

  function resetScene(){
    [box,lid,base,inner,beam,halo,flash].forEach(function(el){el.getAnimations().forEach(function(a){a.cancel()})});
    rays.classList.remove('on');
    popup.hidden=true;
    stage.classList.remove('busy');
    btn.disabled=false;state='idle';
    stage.animate([{transform:'scale(.8)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:520,easing:'cubic-bezier(.34,1.56,.64,1)'});
  }

  btn.addEventListener('click',openBox);
  stage.addEventListener('click',openBox);
  $('#done').addEventListener('click',resetScene);

  /* ---------- Prototype sheet ---------- */
  var sheet=$('#sheet'),sel=$('#forceSel'),odds=$('#odds');
  var total=PRIZES.reduce(function(a,p){return a+p.w},0);
  PRIZES.forEach(function(p){
    var op=document.createElement('option');op.value=p.id;op.textContent=p.tier+' · '+p.name;sel.appendChild(op);
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+p.tier+'</td><td>'+p.name+'</td><td>'+(p.w/total*100).toFixed(0)+'%</td>';
    odds.appendChild(tr);
  });
  $('#protoBtn').addEventListener('click',function(){sheet.hidden=!sheet.hidden});
  $('#sheetClose').addEventListener('click',function(){sheet.hidden=true});
  sel.addEventListener('change',function(){forced=sel.value});
  $('#muteChk').addEventListener('change',function(e){muted=e.target.checked});
  $('#choirChk').addEventListener('change',function(e){choirOn=e.target.checked});
})();
</script>
